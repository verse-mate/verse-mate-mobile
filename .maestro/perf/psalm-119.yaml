# Psalm 119 — the longest chapter in the Bible (176 verses), worst case
#
# Thin wrapper: all behaviour lives in shared/reader-workout.yaml so every
# scenario exercises an identical interaction sequence. Only the chapter differs,
# which is what makes "cost scales with verse count" testable.

- runFlow:
    file: shared/reader-workout.yaml
    env:
      TESTAMENT_TAB: "tab-old-testament"
      BOOK_SLUG: "psalms"
      CHAPTER: "119"
